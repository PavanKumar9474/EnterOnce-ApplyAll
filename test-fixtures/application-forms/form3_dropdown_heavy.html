<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Enterprise - Questionnaire & Dropdown Form</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      max-width: 650px;
      width: 100%;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
    }
    select, input[type="text"], input[type="email"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .badge {
      background: #fef3c7;
      color: #b45309;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 16px;
    }
    .btn {
      background: #b45309;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Fixture #3: Dropdown & Selection Heavy Form (Taleo / Lever Style)</div>
    <h2>Apex Enterprise Systems</h2>
    <p style="color:#64748b; margin-top:-6px; margin-bottom:24px;">Associate Solutions Architect</p>

    <form id="dropdownForm" onsubmit="event.preventDefault(); alert('Questionnaire submitted!');">
      <!-- Basic candidate identification -->
      <div class="form-group">
        <label for="applicantName">Applicant Full Name *</label>
        <input type="text" id="applicantName" name="applicant_name" required>
      </div>

      <div class="form-group">
        <label for="applicantEmail">Contact Email *</label>
        <input type="email" id="applicantEmail" name="applicant_email" required>
      </div>

      <!-- Dropdown: Degree -->
      <div class="form-group">
        <label for="educationDegree">Highest Level of Education *</label>
        <select id="educationDegree" name="highest_degree" required>
          <option value="">-- Please Select Degree --</option>
          <option value="high_school">High School Diploma</option>
          <option value="associate">Associate Degree</option>
          <option value="bachelor_science">Bachelor of Science</option>
          <option value="bachelor_tech">Bachelor of Technology</option>
          <option value="master_science">Master of Science</option>
          <option value="master_tech">Master of Technology</option>
          <option value="doctorate">Doctorate / Ph.D.</option>
        </select>
      </div>

      <!-- Dropdown: Graduation Year -->
      <div class="form-group">
        <label for="passingYear">Year of Graduation / Passing *</label>
        <select id="passingYear" name="graduation_year" required>
          <option value="">-- Select Year --</option>
          <option value="2026">2026 (Upcoming)</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
        </select>
      </div>

      <!-- Dropdown: Country -->
      <div class="form-group">
        <label for="countrySelect">Country of Current Residence *</label>
        <select id="countrySelect" name="residence_country" required>
          <option value="">-- Choose Country --</option>
          <option value="US">United States</option>
          <option value="IN">India</option>
          <option value="CA">Canada</option>
          <option value="UK">United Kingdom</option>
          <option value="DE">Germany</option>
        </select>
      </div>

      <!-- Radio: Work Authorization -->
      <div class="form-group">
        <label>Are you legally authorized to work in the country of this position? *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="work_authorization" value="yes"> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="work_authorization" value="no"> No
          </label>
        </div>
      </div>

      <!-- Radio: Relocation -->
      <div class="form-group">
        <label>Are you willing to relocate for this position if required? *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="willing_to_relocate" value="yes"> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="willing_to_relocate" value="no"> No
          </label>
        </div>
      </div>

      <!-- Notice period in days -->
      <div class="form-group">
        <label for="noticeDays">Notice Period (in Days)</label>
        <select id="noticeDays" name="notice_period_days">
          <option value="">-- Select Notice Period --</option>
          <option value="0">Immediate / 0 Days</option>
          <option value="15">15 Days</option>
          <option value="30">30 Days</option>
          <option value="60">60 Days</option>
          <option value="90">90 Days</option>
        </select>
      </div>

      <button type="submit" class="btn">Submit Assessment</button>
    </form>
  </div>
</body>
</html>
