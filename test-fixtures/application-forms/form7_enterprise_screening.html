<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM Global Services - Enterprise Application & Screening Questionnaire</title>
  <meta property="og:site_name" content="IBM">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .form-container {
      background: #1e293b;
      max-width: 680px;
      width: 100%;
      border-radius: 12px;
      padding: 32px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .badge {
      background: #1e3a8a;
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #60a5fa;
      margin: 24px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #334155;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="email"], input[type="tel"], select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #cbd5e1;
      cursor: pointer;
    }
    .btn-submit {
      background: #2563eb;
      color: #ffffff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn-submit:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="badge">Fixture #7: Enterprise Screening & Smart Question Workflow (IBM Style)</div>
    <h1 style="margin: 0 0 6px 0; font-size: 22px;">IBM Enterprise Cloud Services</h1>
    <p style="color: #94a3b8; margin: 0 0 20px 0; font-size: 14px;">Senior Cloud Solutions Architect &bull; Requisition #IBM-98214</p>

    <form id="enterpriseForm" onsubmit="event.preventDefault(); alert('Application submitted to IBM Careers!');">
      <!-- Candidate Identification -->
      <div class="section-title">1. Candidate Information</div>
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="applicant_fullname" placeholder="Candidate full legal name" required>
      </div>

      <div class="form-group">
        <label for="email">Primary Email Address *</label>
        <input type="email" id="email" name="applicant_email" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone / Mobile Contact *</label>
        <input type="tel" id="phone" name="applicant_phone" placeholder="+1 (555) 000-0000" required>
      </div>

      <!-- Eligibility & Pre-Screening Questions -->
      <div class="section-title">2. Work Eligibility & Screening</div>

      <div class="form-group">
        <label>Are you legally authorized to work in this country? *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="work_auth" value="yes"> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="work_auth" value="no"> No
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Will you now or in the future require employment visa sponsorship? *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="visa_sponsor" value="yes"> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="visa_sponsor" value="no"> No
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Are you open and willing to relocate for this position? *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="relocation_opt" value="yes"> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="relocation_opt" value="no"> No
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="noticePeriod">Notice period (in days) *</label>
        <input type="text" id="noticePeriod" name="notice_period_days" placeholder="e.g. 30" required>
      </div>

      <div class="form-group">
        <label for="expectedSalary">Expected Annual Compensation (USD or local currency) *</label>
        <input type="text" id="expectedSalary" name="expected_salary" placeholder="e.g. $135,000" required>
      </div>

      <!-- Company Specific & Open Screening Questions -->
      <div class="section-title">3. Company & Role Specific Questionnaire</div>

      <!-- This matches our seeded IBM company-specific answer in backend! -->
      <div class="form-group">
        <label for="ibmCloudExp">Do you have experience with enterprise cloud deployment models?</label>
        <textarea id="ibmCloudExp" name="ibm_portal_experience" rows="3" placeholder="Describe your experience with hybrid cloud..."></textarea>
      </div>

      <!-- This is a new question without a pre-saved answer, triggering the interactive "Answer needed" prompt! -->
      <div class="form-group">
        <label for="whyEnterprise">What is your primary motivation for applying to this enterprise?</label>
        <textarea id="whyEnterprise" name="primary_motivation_enterprise" rows="3" placeholder="Explain what drives your interest in our mission..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Submit Application to IBM</button>
    </form>
  </div>
</body>
</html>
