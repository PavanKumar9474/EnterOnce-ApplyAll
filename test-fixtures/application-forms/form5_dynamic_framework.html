<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulated React Framework Application</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .framework-card {
      background: #1e293b;
      max-width: 650px;
      width: 100%;
      border-radius: 12px;
      padding: 32px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .badge {
      background: #312e81;
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 14px;
      color: #f8fafc;
    }
    input:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
    }
    .state-monitor {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      margin-top: 20px;
      white-space: pre-wrap;
    }
    .btn-action {
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-action:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="framework-card">
    <div class="badge">Fixture #5: Simulated Framework-Controlled Form (React Synthetic Events)</div>
    <h2>NovaTech Cloud Platform</h2>
    <p style="color:#94a3b8; margin-top:-6px; margin-bottom:20px;">Staff Infrastructure Engineer</p>

    <!-- Simulated React State Hook Controller -->
    <form id="reactForm">
      <div class="form-group">
        <label for="fx_fullname">Candidate Full Name</label>
        <input type="text" id="fx_fullname" data-state="fullName">
      </div>

      <div class="form-group">
        <label for="fx_email">Email Address</label>
        <input type="email" id="fx_email" data-state="email">
      </div>

      <div class="form-group">
        <label for="fx_phone">Mobile Number</label>
        <input type="tel" id="fx_phone" data-state="phone">
      </div>

      <div class="form-group">
        <label for="fx_github">GitHub Profile URL</label>
        <input type="url" id="fx_github" data-state="github">
      </div>

      <!-- Container for dynamically injected fields -->
      <div id="dynamicContainer"></div>

      <button type="button" id="btnAddDynamicField" class="btn-action">+ Inject Dynamic Education Field</button>

      <!-- Live Reactive State Inspector -->
      <div>
        <label>Framework State Inspector (React State Simulation):</label>
        <div id="stateOutput" class="state-monitor">State: {
  fullName: "",
  email: "",
  phone: "",
  github: ""
}</div>
      </div>
    </form>
  </div>

  <script>
    // State store imitating React useState
    const formState = {
      fullName: '',
      email: '',
      phone: '',
      github: ''
    };

    function updateStateView() {
      document.getElementById('stateOutput').innerText = 'State: ' + JSON.stringify(formState, null, 2);
    }

    // Attach synthetic event listeners to all state inputs
    document.querySelectorAll('[data-state]').forEach(input => {
      input.addEventListener('input', (e) => {
        const key = e.target.getAttribute('data-state');
        formState[key] = e.target.value;
        updateStateView();
      });
      input.addEventListener('change', (e) => {
        const key = e.target.getAttribute('data-state');
        formState[key] = e.target.value;
        updateStateView();
      });
    });

    // Test dynamic field insertion
    let dynamicCount = 0;
    document.getElementById('btnAddDynamicField').addEventListener('click', () => {
      dynamicCount++;
      const container = document.getElementById('dynamicContainer');
      const div = document.createElement('div');
      div.className = 'form-group';
      div.innerHTML = `
        <label for="dyn_university_${dynamicCount}">University / College Name #${dynamicCount}</label>
        <input type="text" id="dyn_university_${dynamicCount}" name="dyn_university_${dynamicCount}" placeholder="Dynamically inserted institution">
      `;
      container.appendChild(div);
    });
  </script>
</body>
</html>
